<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회사명 건설</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Noto Sans KR', sans-serif;
        background: #f3f4f6;
        color: #111;
    }

    header {
        background: #0f172a;
        color: white;
        padding: 50px 20px;
        text-align: center;
    }

    header h1 {
        margin: 0;
        font-size: 42px;
        letter-spacing: -1px;
    }

    header p {
        margin-top: 10px;
        color: #cbd5f5;
    }

    nav {
        background: white;
        padding: 15px;
        text-align: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        position: sticky;
        top: 0;
    }

    nav a {
        text-decoration: none;
        color: #0f172a;
        margin: 0 20px;
        font-size: 15px;
        font-weight: 500;
    }

    nav a:hover {
        color: #2563eb;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        padding: 30px 20px;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    h2 {
        margin-top: 0;
        font-size: 22px;
        color: #0f172a;
    }

    .ceo-name {
        font-size: 20px;
        font-weight: bold;
        color: #2563eb;
        margin: 10px 0;
    }

    .services p {
        margin: 8px 0;
    }

    footer {
        text-align: center;
        padding: 40px 20px;
        font-size: 13px;
        color: #666;
    }
</style>
</head>

<body>

<header>
    <h1>회사명 건설</h1>
    <p>신뢰 · 품질 · 책임 시공</p>
</header>

<nav>
    <a href="#">회사 소개</a>
    <a href="#">업무 분야</a>
    <a href="#">시공 실적</a>
    <a href="#">문의하기</a>
</nav>

<div class="container">

    <div class="card">
        <h2>회사 소개</h2>
        <p>
            회사명 건설은 풍부한 경험과 전문성을 바탕으로  
            고객의 가치를 최우선으로 생각하는 건설 파트너입니다.
        </p>
    </div>

    <div class="card">
        <h2>대표이사</h2>
        <div class="ceo-name">홍길동</div>
        <p>
            다년간의 건설 및 시공 경험을 바탕으로  
            안전하고 완성도 높은 프로젝트를 제공합니다.
        </p>
    </div>

    <div class="card services">
        <h2>주요 업무</h2>
        <p>✔ 건축 공사</p>
        <p>✔ 리모델링</p>
        <p>✔ 인테리어</p>
        <p>✔ 유지보수</p>
    </div>

</div>

<footer>
    © 회사명 건설. All Rights Reserved.
</footer>

</body>
</html>
